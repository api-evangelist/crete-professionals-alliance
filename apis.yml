description: 'Crete Professionals Alliance (rebranded in 2025 as "Current", current.co) is a growth
  platform for independent accounting firms, backed by Bessemer Venture Partners. The alliance provides
  member firms with technology, talent, capital, and strategy to compete at enterprise scale, spanning
  48 partner firms across 39 states and 3 countries with more than 2,000 employees. Service lines include
  accounting, advisory, audit and attest, client accounting services, and tax. This is a professional
  services / accounting company, not a developer-facing API provider: it publishes no developer portal,
  API, SDKs, or technical documentation. The record is maintained in the API Evangelist network for
  portfolio-graph coverage of Bessemer holdings.'
